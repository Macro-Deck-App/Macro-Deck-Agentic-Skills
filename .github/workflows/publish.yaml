name: Validate and publish skills

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Show GitHub CLI version
        run: gh --version && gh skill --help > /dev/null
      - name: Validate skills
        run: gh skill publish --dry-run

  publish:
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate tag format
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag must look like v1.0.0" >&2
            exit 1
          fi
      - name: Publish release
        env:
          TAG: ${{ inputs.tag }}
        run: gh skill publish --tag "$TAG"
